version: 2

models:
  - name: dim_customer
    description: Customer dimension for the full transactional household universe.
    columns:
      - name: household_id
        data_tests: [not_null, unique]
      - name: has_demographic_profile
        data_tests: [not_null]

  - name: dim_product
    description: Product dimension at one row per product.
    columns:
      - name: product_id
        data_tests: [not_null, unique]

  - name: dim_campaign
    description: Campaign dimension with scheduled and DAY-711-observed intervals.
    columns:
      - name: campaign_id
        data_tests: [not_null, unique]
      - name: campaign_type
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['TypeA', 'TypeB', 'TypeC']
      - name: start_day_number
        data_tests: [not_null]
      - name: end_day_number
        data_tests: [not_null]
      - name: observed_end_day_number
        data_tests: [not_null]
      - name: scheduled_campaign_days
        data_tests: [not_null]
      - name: observed_campaign_days
        data_tests: [not_null]
      - name: is_fully_observed
        data_tests: [not_null]

  - name: dim_store
    description: Store key dimension covering stores observed in sales or promotions.
    columns:
      - name: store_id
        data_tests: [not_null, unique]

  - name: dim_relative_time
    description: Relative day/week dimension without inventing calendar dates.
    columns:
      - name: day_number
        data_tests: [not_null, unique]
      - name: week_number
        data_tests: [not_null]

  - name: fact_sales
    description: Sales fact; one row is one product line within one shopping basket.
    columns:
      - name: household_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: household_id
      - name: basket_id
        data_tests: [not_null]
      - name: product_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_product')
                field: product_id
      - name: store_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_store')
                field: store_id
      - name: day_number
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_relative_time')
                field: day_number
      - name: sales_value
        data_tests: [not_null]

  - name: fact_campaign_received
    description: >
      Campaign receipt/assignment fact; one row is one household assigned to one
      campaign. The name deliberately avoids claiming verified exposure.
    columns:
      - name: household_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: household_id
      - name: campaign_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_campaign')
                field: campaign_id

  - name: fact_coupon_redemption
    description: Coupon redemption fact; one row is one observed redemption event.
    columns:
      - name: household_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: household_id
      - name: coupon_upc
        data_tests: [not_null]
      - name: campaign_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_campaign')
                field: campaign_id
      - name: day_number
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_relative_time')
                field: day_number

  - name: fact_promotions
    description: Product-store-week promotion fact resolved from raw promotion conditions.
    columns:
      - name: product_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_product')
                field: product_id
      - name: store_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_store')
                field: store_id
      - name: week_number
        data_tests: [not_null]
      - name: has_any_promotion
        data_tests: [not_null]

  - name: mart_customer_360
    description: >
      Customer-level mart combining demographics, behavior, percentile-based RFM,
      campaign receipt history and coupon redemption activity.
    columns:
      - name: household_id
        data_tests: [not_null, unique]
      - name: recency_days
        data_tests: [not_null]
      - name: basket_count
        data_tests: [not_null]
      - name: monetary_value
        data_tests: [not_null]
      - name: average_order_value
        data_tests: [not_null]
      - name: rfm_total_score
        data_tests: [not_null]
      - name: rfm_code
        data_tests: [not_null]
      - name: campaigns_received
        data_tests: [not_null]
      - name: coupon_redemption_events
        data_tests: [not_null]
