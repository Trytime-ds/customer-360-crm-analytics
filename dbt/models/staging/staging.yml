version: 2

models:
  - name: stg_transactions
    description: >
      Clean and standardized transaction-line staging model.
      One row represents one product within one shopping basket.

    columns:
      - name: household_id
        description: Household identifier.
        data_tests:
          - not_null

      - name: basket_id
        description: Shopping basket identifier.
        data_tests:
          - not_null

      - name: day_number
        description: Relative day number in the source dataset.
        data_tests:
          - not_null

      - name: product_id
        description: Product identifier.
        data_tests:
          - not_null

          - relationships:
              arguments:
                to: ref('stg_products')
                field: product_id

      - name: quantity
        description: Source quantity. Not globally comparable across all product categories.
        data_tests:
          - not_null

      - name: sales_value
        description: Retailer revenue / net sales value.
        data_tests:
          - not_null

      - name: store_id
        description: Store identifier.
        data_tests:
          - not_null

      - name: week_number
        description: Relative week number in the source dataset.
        data_tests:
          - not_null
  
  - name: stg_products
    description: >
      Standardized product master. One row represents one unique product.
      Preserves source product attributes while converting whitespace-only
      categorical and size values to null.

    columns:
      - name: product_id
        description: Unique product identifier.
        data_tests:
          - not_null
          - unique

      - name: manufacturer_id
        description: Source manufacturer identifier.
        data_tests:
          - not_null

      - name: brand_type
        description: >
          Product brand classification from source: National or Private.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - National
                  - Private

      - name: department
        description: Product department. Whitespace-only source values are represented as null.

      - name: commodity
        description: Product commodity classification. Whitespace-only source values are represented as null.

      - name: sub_commodity
        description: Product sub-commodity classification. Whitespace-only source values are represented as null.

      - name: current_product_size
        description: Source product-size representation. Whitespace-only values are represented as null.

  - name: stg_household_demographics
    description: >
      Standardized household demographic attributes. One row represents one
      household with available demographic information. This model covers only
      the demographic subset of the full transactional customer universe.

    columns:
      - name: household_id
        description: Unique household identifier for households with demographic data.
        data_tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('stg_transactions')
                field: household_id

      - name: age_range
        description: Source-defined age range of the household.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - "19-24"
                  - "25-34"
                  - "35-44"
                  - "45-54"
                  - "55-64"
                  - "65+"

      - name: marital_status_code
        description: Source marital status code. Semantics are preserved without recoding.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - A
                  - B
                  - U

      - name: income_range
        description: Source-defined household income range.
        data_tests:
          - not_null

      - name: homeowner_status
        description: Source-defined homeowner status, including explicit Unknown values.
        data_tests:
          - not_null

      - name: household_composition
        description: Source-defined household composition, including explicit Unknown values.
        data_tests:
          - not_null

      - name: household_size
        description: Source-defined household size category.
        data_tests:
          - not_null

      - name: kid_category
        description: Source-defined children category, including None/Unknown.
        data_tests:
          - not_null

  - name: stg_campaigns
    description: >
      Standardized campaign definitions. One row represents one unique campaign
      with its source-defined type and relative start/end day interval.

    columns:
      - name: campaign_id
        description: Unique campaign identifier.
        data_tests:
          - not_null
          - unique

      - name: campaign_type
        description: Source-defined campaign type.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - TypeA
                  - TypeB
                  - TypeC

      - name: start_day_number
        description: Relative day number when the campaign starts.
        data_tests:
          - not_null

      - name: end_day_number
        description: Relative day number when the campaign ends.
        data_tests:
          - not_null

  - name: stg_campaign_assignments
    description: >
      Household assignments to marketing campaigns.
      One row represents one household assigned to one campaign.

    columns:
      - name: household_id
        description: Unique identifier of the household.
        data_tests:
          - not_null

      - name: campaign_id
        description: Unique identifier of the campaign.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_campaigns')
                field: campaign_id

      - name: campaign_type
        description: Campaign type provided by the source.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['TypeA', 'TypeB', 'TypeC']

  - name: stg_coupons
    description: >
      Deduplicated associations between coupons, products and campaigns.
      One row represents one coupon-product-campaign association.

    columns:
      - name: coupon_upc
        description: Coupon identifier.
        data_tests:
          - not_null

      - name: product_id
        description: Product associated with the coupon.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_products')
                field: product_id

      - name: campaign_id
        description: Campaign associated with the coupon.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_campaigns')
                field: campaign_id

  - name: stg_coupon_redemptions
    description: >
      Coupon redemption events by household.
      One row represents one coupon redemption event for a household,
      campaign and day.

    columns:
      - name: household_id
        description: Household that redeemed the coupon.
        data_tests:
          - not_null

      - name: coupon_upc
        description: Identifier of the redeemed coupon.
        data_tests:
          - not_null

      - name: campaign_id
        description: Campaign associated with the redemption.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_campaigns')
                field: campaign_id

      - name: day_number
        description: Relative day number when the redemption occurred.
        data_tests:
          - not_null

  - name: stg_promotions
    description: >
      Product-store-week promotional condition records.
      The raw grain may contain multiple records for the same
      product, store and week when promotional codes differ.

    columns:
      - name: product_id
        description: Product associated with the promotional condition.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_products')
                field: product_id

      - name: store_id
        description: Store associated with the promotional condition.
        data_tests:
          - not_null

      - name: week_number
        description: Relative week number of the promotional condition.
        data_tests:
          - not_null

      - name: display_code
        description: Source categorical code describing display placement.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['0', '1', '2', '3', '4', '5', '6', '7', '9', 'A']

      - name: mailer_code
        description: Source categorical code describing mailer promotion.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['0', 'A', 'C', 'D', 'F', 'H', 'J', 'L', 'P', 'X', 'Z']