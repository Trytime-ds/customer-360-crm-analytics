version: 2

sources:
  - name: customer360
    description: "Raw source tables from the dunnhumby Complete Journey dataset stored in BigQuery."
    schema: customer360

    tables:
      - name: transaction_data
        description: "Raw transaction line-level data."

      - name: product
        description: "Raw product master data."

      - name: hh_demographic
        description: "Raw household demographic data with partial customer coverage."

      - name: campaign_desc
        description: "Raw campaign-level description data."

      - name: campaign_table
        description: "Raw household-to-campaign assignment data."

      - name: coupon
        description: "Raw coupon-to-product and campaign associations."

      - name: coupon_redempt
        description: "Raw coupon redemption events."

      - name: causal_data
        description: "Raw promotional conditions by product, store and week."

