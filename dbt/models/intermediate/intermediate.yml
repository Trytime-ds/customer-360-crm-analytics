version: 2

models:
  - name: int_customer_metrics
    description: >
      Customer-level transactional metrics for the frozen Customer 360 / RFM
      observation window (DAY 1-711). One row represents one household observed
      in stg_transactions. This reusable intermediate model centralizes behavioral
      metrics before dimensional and analytical mart construction.

    columns:
      - name: household_id
        description: Unique household identifier in the transactional customer universe.
        data_tests:
          - not_null
          - unique

      - name: first_purchase_day
        description: First observed purchase day within DAY 1-711.
        data_tests:
          - not_null

      - name: last_purchase_day
        description: Last observed purchase day within DAY 1-711.
        data_tests:
          - not_null

      - name: recency_days
        description: Days since the last observed purchase relative to the DAY 711 snapshot.
        data_tests:
          - not_null

      - name: basket_count
        description: Number of distinct shopping baskets observed for the household.
        data_tests:
          - not_null

      - name: monetary_value
        description: Total retailer net sales value generated by the household within DAY 1-711.
        data_tests:
          - not_null

      - name: average_order_value
        description: Monetary value divided by the number of distinct baskets.
        data_tests:
          - not_null

      - name: is_repeat_customer
        description: True when the household has at least two distinct baskets.
        data_tests:
          - not_null
