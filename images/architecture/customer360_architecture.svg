<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760">
  <defs>
    <style>
      .bg{fill:#F4F6FA}.box{fill:#FFFFFF;stroke:#D9E2F1;stroke-width:2}.navy{fill:#111835}.blue{fill:#2948C2}.light{fill:#EAF1FF}.yellow{fill:#F4D532}
